[package]
name = "solverforge-iap"
version = "0.1.1"
edition = "2021"
rust-version = "1.95"
description = "Invigilator assignment solver (IAP-CM / IAP-CR) built with SolverForge"
license = "Apache-2.0"
repository = "https://github.com/blackopsrepl/solverforge-iap"

[[bin]]
name = "solverforge_iap"
path = "src/main.rs"

[dependencies]
solverforge = { version = "0.22.0", features = ["serde", "console", "verbose-logging"] }
solverforge-scoring = "0.22.0"

solverforge-ui = "0.9.0"

# HTTP API server
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tower-http = { version = "0.6.11", features = ["cors", "fs"] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
schemars = { version = "1.0", optional = true }

# Utilities
parking_lot = "0.12.5"

[features]
schema = ["dep:schemars"]
