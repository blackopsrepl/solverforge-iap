# Native SolverForge only: construct, reach feasibility, optimize contacts.
# Availability candidates remain model metadata; every rule is scored natively.
random_seed = 1
# Local-search evaluators per step, main thread included. Parallel evaluation
# keeps the sequential acceptance order but replays every committed move on
# each replica; on IAP that replay (ruin-recreate above all) costs more than
# the parallel trials save, so the default stays sequential. A job opts in
# with `move_threads` (1-32) in its payload.
move_thread_count = { count = 1 }

[termination]
seconds_spent_limit = 60

[[phases]]
type = "construction_heuristic"
construction_heuristic_type = "cheapest_insertion"
entity_class = "Seat"
variable_name = "invigilator_idx"

# Stop repairing as soon as the hard level reaches zero.
[[phases]]
type = "local_search"
[phases.termination]
best_score_limit = "0hard/-1000000000soft"
[phases.acceptor]
type = "late_acceptance"
late_acceptance_size = 400
[phases.forager]
type = "accepted_count"
limit = 1
[phases.move_selector]
type = "union_move_selector"
[[phases.move_selector.selectors]]
type = "change_move_selector"
entity_class = "Seat"
variable_name = "invigilator_idx"
[[phases.move_selector.selectors]]
type = "swap_move_selector"
entity_class = "Seat"
variable_name = "invigilator_idx"
[[phases.move_selector.selectors]]
type = "ruin_recreate_move_selector"
entity_class = "Seat"
variable_name = "invigilator_idx"
min_ruin_count = 2
max_ruin_count = 6
recreate_heuristic_type = "cheapest_insertion"

# Optimize only the actual contact objective; retain hard constraints throughout.
[[phases]]
type = "local_search"
[phases.acceptor]
type = "late_acceptance"
late_acceptance_size = 400
[phases.forager]
type = "accepted_count"
limit = 1
[phases.move_selector]
type = "union_move_selector"
[[phases.move_selector.selectors]]
type = "change_move_selector"
entity_class = "Seat"
variable_name = "invigilator_idx"
[[phases.move_selector.selectors]]
type = "swap_move_selector"
entity_class = "Seat"
variable_name = "invigilator_idx"
[[phases.move_selector.selectors]]
type = "ruin_recreate_move_selector"
entity_class = "Seat"
variable_name = "invigilator_idx"
min_ruin_count = 2
max_ruin_count = 6
recreate_heuristic_type = "cheapest_insertion"

[[phases.move_selector.selectors]]
type = "nearby_swap_move_selector"
entity_class = "Seat"
variable_name = "invigilator_idx"
max_nearby = 50

[app]
name = "solverforge-iap"
